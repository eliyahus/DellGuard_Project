monitoring:
  threshold_sigma: 3
  check_interval_seconds: 1
  metrics_window_size: 1000

ai:
  provider: ollama
  model: llama3
  timeout_seconds: 60
  max_retries: 5

data:
  metrics_file: /var/dellguard/server_metrics.csv
  baseline_status: Normal

logging:
  level: WARNING
  file: /var/log/dellguard/incidents.log
  format: "%(asctime)s - %(levelname)s - %(message)s"

visualization:
  output_file: /var/dellguard/reports/server_health_chart.png
  figure_size: [12, 6]
  dpi: 150
